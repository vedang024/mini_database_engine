[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minidb"
dynamic = ["version"]
description = "A database engine built from scratch in Python"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
minidb = "minidb.cli:main"

[tool.setuptools.dynamic]
version = { attr = "minidb.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]